# Self-developed WebRTC RTC module on OpenResty + nginx-http-flv-module.
# RTMP ingest (1935) -> bridge -> RTP/SRTP (UDP 8000) -> browser WebRTC.
# HTTP-FLV playback (18082) is preserved alongside WebRTC signaling.

worker_processes  2;   # Phase 1: shm registry makes cross-worker signaling correct
error_log  logs/error.log  info;

# Cross-worker RTC state (source/session index + media rings) for multi-worker.
# Phase 0 initialises the zone; later phases move the registry into it.
rtc_zone rtc 32m;

# 多 worker 下 RTMP/HTTP-FLV 跨 worker: 推流建立后经 unix socket 自动推给所有
# worker (ngx_rtmp_auto_push_module), 使 HTTP-FLV 播放不依赖与推流同 worker。
rtmp_auto_push on;

events {
    worker_connections  1024;
}

# ===== RTMP ingest + bridge (nginx-http-flv-module + ngx_rtmp_rtc_bridge_module) =====
rtmp {
    rtc_audio_bitrate 64000;      # Opus target bitrate (default 64000)
    rtc_rtcp_sr_interval 2000ms;  # RTCP sender-report interval (default 2s)

    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            gop_cache on;           # GOP cache keeps HTTP-FLV first-frame fast
            # 推流鉴权: 回调本机 HTTP 端点, 2xx 放行 / 非 2xx 拒绝
            on_publish http://127.0.0.1:18082/rtmp/on_publish;
            # 播放鉴权: 同一把 play secret (播放页也就持有它), 与推流用的
            # publish secret 不同。rtmp_auth.lua 按 URI 区分用途。
            on_play http://127.0.0.1:18082/rtmp/on_play;
            # The bridge module (ngx_rtmp_rtc_bridge_module) hooks the video
            # events and forwards H264 NALUs to the RTC source automatically.

            # HLS output (muxer built into nginx-http-flv-module; served under /hls/).
            # Only the worker that actually receives the publish writes segments
            # (auto_pushed copies are skipped), so no cross-worker contention.
            hls on;
            hls_path html/hls;
            hls_fragment 2s;            # 低延迟: 2s 分片
            hls_max_fragment 4s;
            hls_playlist_length 10s;    # 滑动窗口 ~5 片
            hls_cleanup on;
            hls_type live;

            # DASH output (fMP4 muxer built into nginx-http-flv-module; /dash/).
            dash on;
            dash_path html/dash;
            dash_fragment 2s;
            dash_playlist_length 10s;
            dash_cleanup on;

            # Record every published stream to FLV on disk (record module built
            # into nginx-http-flv-module). Same as HLS/DASH: only the worker that
            # actually receives the publish writes; auto_pushed copies are skipped.
            # Files land under <prefix>/rec/<stream>-<timestamp>.flv.
            record all;
            record_path rec;
            record_unique on;
            record_suffix -%Y-%m-%d-%H_%M_%S.flv;
        }
    }
}

# ===== HTTP gateway: HTTP-FLV playback + WebRTC signaling =====
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    # Largest signaling body (SDP offer) accepted. nginx writes a body larger
    # than client_body_buffer_size to a temp file, where the C module cannot
    # measure it, so the module clamps this to that buffer at request time --
    # raising this alone will not let a body past the buffer. Size them
    # together if a real client ever exceeds 64k.
    client_body_buffer_size 128k;

    # Dynamic config: shared dict for stream keys + pure-Lua module path.
    # Control-plane HTTP log feeds `run.sh ngxtop` (real-time access metrics).
    # /live (long-lived HTTP-FLV) is excluded below so ngxtop reports only
    # short request/response API traffic with request_time.
    log_format rtc '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
    access_log logs/rtc-access.log rtc;
    lua_shared_dict stream_keys 1m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict rtc_stats 1m;
    lua_shared_dict rtc_stats_history 1m;
    lua_package_path "conf/?.lua;;";

    # Hot-reload stream keys from JSON every 10s (no nginx reload needed).
    # Live-stream stats are mirrored into lua_shared_dict rtc_stats every second
    # by the C module (ngx_rtc_http_module), so /rtc/v1/stats never fires an
    # internal subrequest.
    init_worker_by_lua_block {
        local config = require "config"
        config.reload()
        local function reload(premature)
            if not premature then
                config.reload()
            end
        end
        ngx.timer.every(10, reload)
        -- Ring-buffer history sampler (worker 0 only), see conf/rtc_history.lua.
        require("rtc_history").start()
    }

    server {
        listen 18082;

        # WebRTC player page etc.
        location / {
            root   html;
            index  index.html;
        }

        # HTTP-FLV playback (preserved): http://<host>:18082/live?app=live&stream=livestream&key=...
        location /live {
            # Keep the long-lived media connection out of the control-plane log.
            access_log off;
            # HTTP-FLV 播放鉴权: 与 /rtc/v1/play/ 同源 key 校验
            access_by_lua_file conf/flv_auth.lua;
            # 鉴权通过即把 shared dict 里该流的在线观看计数 +1; 连接结束(log 阶段)
            # 由 conf/flv_close.lua 减一, 供 /rtc/v1/flvcnt 跨 worker 聚合。
            log_by_lua_file conf/flv_close.lua;
            flv_live on;
            chunked_transfer_encoding off;
        }

        # HLS static output: http://<host>:18082/hls/<stream>.m3u8 (+ .ts segments).
        location /hls/ {
            alias html/hls/;
            add_header Cache-Control no-cache;
        }

        # DASH static output: http://<host>:18082/dash/<stream>.mpd (+ .m4s segments).
        location /dash/ {
            alias html/dash/;
            add_header Cache-Control no-cache;
            types {
                application/dash+xml mpd;
                video/mp4 m4s;
            }
        }

        # HTTP-FLV 播放页 (OpenResty 服务端渲染: 读 rtc_stats 共享 dict 内联在线流,
        # 与 rtcplayer.html(WebRTC) 互为跳转; flv.min.js 静态由 location / 服务)
        location /flvplayer {
            content_by_lua_file conf/flvplayer.lua;
        }

        # RTMP on_publish notify 回调端点 (推流鉴权), 仅本机 RTMP 模块调用
        location /rtmp/on_publish {
            content_by_lua_file conf/rtmp_auth.lua;
        }

        # RTMP on_play notify 回调端点 (播放鉴权), 与 on_publish 共用一份 Lua:
        # 两者只差校验用的 secret。
        location /rtmp/on_play {
            content_by_lua_file conf/rtmp_auth.lua;
        }

        # WebRTC signaling: POST /rtc/v1/play/ { sdp, streamurl, key, ... }
        # returns { code:0, sdp:"<answer>" }. Handled by ngx_rtc_http_module.
        # Lua authorizes the play request (stream key check + rate limit) before
        # rtc_play runs in the content phase.
        location /rtc/v1/play/ {
            access_by_lua_file conf/auth.lua;
            # candidate IP 由 run.sh 自动探测主网卡 IP 后注入 (可用 RTC_CANDIDATE_IP 覆盖)
            rtc_candidate_ip 172.16.48.122;
            rtc_candidate_port 8000;
            rtc_max_sdp_len 64k;
            rtc_play;
        }

        # WHIP (RFC 8224) WebRTC push: POST /whip/endpoint?app=live&stream=xxx
        # with a plain SDP offer body; returns 201 + recvonly SDP answer.
        location /whip/endpoint {
            # Ingest auth, same publish token as RTMP on_publish; the C handler
            # only parses the SDP body.
            access_by_lua_file conf/whip_auth.lua;
            rtc_candidate_ip 172.16.48.122;
            rtc_candidate_port 8000;
            rtc_max_sdp_len 64k;
            rtc_whip;
        }

        # Runtime live-stream stats (SRS /api/v1/streams equivalent), loopback-only.
        # Public API + rate-limit in Lua; raw media stats are mirrored by the C
        # module into lua_shared_dict rtc_stats every second (conf/stats.lua).
        location /rtc/v1/stats {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_file conf/stats.lua;
        }

        # Ring-buffer time-series of the stats mirror (25 min window, 5s buckets).
        # Worker 0 samples rtc_stats every 5s; conf/rtc_history.lua also serves
        # this endpoint. Same read-only access policy as /rtc/v1/stats.
        location /rtc/v1/stats/history {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_file conf/rtc_history.lua;
        }

        # Concurrent HTTP-FLV viewers per stream, aggregated across workers by
        # shared dict counters (access +log hooks in /live). Pure Lua; the stock
        # ngx_rtmp_stat /stat is worker-local and unreliable in multi-worker.
        location /rtc/v1/flvcnt {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_file conf/flvcnt.lua;
        }

        # Prometheus metrics (text exposition), same read-only data source.
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            content_by_lua_file conf/metrics.lua;
        }

        # Read-only admin API: live streams + viewers, loopback-only.
        location /admin/streams {
            allow 127.0.0.1;
            deny all;
            content_by_lua_file conf/admin_streams.lua;
        }

        # Kick one viewer by session id (loopback-only). Forwards to the
        # internal C handler, which flips the shm close_requested flag.
        location /admin/streams/kick {
            allow 127.0.0.1;
            deny all;
            content_by_lua_file conf/admin_kick.lua;
        }

        # Disconnect every viewer of one stream (loopback-only). Forwards to
        # the internal C handler, which flips every skeleton's close flag.
        location /admin/streams/disconnect {
            allow 127.0.0.1;
            deny all;
            content_by_lua_file conf/admin_disconnect.lua;
        }

        # Runtime stream-key admin API (pure Lua), loopback-only.
        location /admin/keys {
            allow 127.0.0.1;
            deny all;
            content_by_lua_file conf/admin_keys.lua;
        }

        # Internal C kick handler (only reachable via ngx.location.capture).
        location /internal/rtc/kick {
            internal;
            rtc_kick;
        }

        # Internal C disconnect handler (only reachable via ngx.location.capture).
        location /internal/rtc/disconnect {
            internal;
            rtc_disconnect;
        }
    }
}

# ===== WebRTC media plane: STUN/DTLS/SRTP over UDP =====
stream {
    server {
        listen 8000 udp reuseport;
        rtc;    # handled by ngx_rtc_stream_module
        rtc_handshake_timeout 10s;
        rtc_ready_timeout 30s;
    }
}
